<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Alone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=9">
    
    <!-- Three.js (Global) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<!-- UI Layer -->
<div id="ui-layer">
    <!-- Main Menu UI -->
    <div id="main-menu" class="ui-screen">
        <h2 class="studio-text">SID STUDIOS</h2>
        <h3 class="presents-text">PRESENTS</h3>
        <h1 class="title-text">I'M ALONE</h1>
        <h4 class="subtitle-text">Psychological Horror Experience</h4>
        
        <div class="menu-options">
            <div class="menu-option active" data-action="newgame">NEW GAME</div>
            <div class="menu-option disabled" data-action="continue">CONTINUE</div>
            <div class="menu-option" data-action="settings">SETTINGS</div>
            <div class="menu-option" data-action="quit">QUIT</div>
        </div>
        
        <div class="menu-footer-left">HEADPHONES RECOMMENDED</div>
        <div class="menu-footer-right">v0.2 3D Alpha</div>
    </div>

    <!-- Intro Text -->
    <div id="intro-screen" class="ui-screen hidden">
        <div id="intro-text-container"></div>
    </div>

    <!-- HUD -->
    <div id="hud" class="ui-screen hidden">
        <div id="crosshair"></div>
        <div id="interaction-prompt" class="hidden">[E] Interact</div>
        <div id="objective-container" class="hidden">
            <span id="objective-text"></span>
        </div>
    </div>

    <!-- Pause / Settings -->
    <div id="pause-menu" class="ui-screen hidden">
        <h1 class="title-text">PAUSED</h1>
        <div class="menu-options">
            <div class="menu-option" data-action="resume">RESUME</div>
            <div class="menu-option" data-action="settings">SETTINGS</div>
            <div class="menu-option" data-action="save">SAVE</div>
            <div class="menu-option" data-action="quit">QUIT TO MENU</div>
        </div>
    </div>
    
    <div id="settings-menu" class="ui-screen hidden">
        <h1 class="title-text">SETTINGS</h1>
        <div class="settings-options">
            <label>Master Volume: <input type="range" id="master-vol" min="0" max="1" step="0.01" value="1"></label><br>
            <label>Mouse Sensitivity: <input type="range" id="mouse-sens" min="0.1" max="5" step="0.1" value="1"></label>
        </div>
        <div class="menu-options" style="margin-top: 40px;">
            <div class="menu-option" data-action="back">BACK</div>
        </div>
    </div>
</div>

<!-- 3D Canvas -->
<canvas id="gameCanvas"></canvas>

<script src="js/systems/AudioManager.js?v=16"></script>
<script src="js/systems/InteractionSystem.js?v=16"></script>
<script src="js/systems/HorrorEventManager.js?v=16"></script>
<script src="js/systems/ObjectiveSystem.js?v=16"></script>
<script src="js/systems/InventorySystem.js?v=16"></script>
<script src="js/systems/SaveSystem.js?v=16"></script>
<script src="js/systems/LightingSystem.js?v=16"></script>

<script src="js/ui/MainMenuUI.js?v=16"></script>
<script src="js/ui/InteractionPrompt.js?v=16"></script>
<script src="js/ui/PauseUI.js?v=16"></script>
<script src="js/ui/SettingsUI.js?v=16"></script>

<script src="js/player/FirstPersonCamera.js?v=16"></script>
<script src="js/player/PlayerController.js?v=16"></script>

<script src="js/scenes/MainMenu.js?v=16"></script>
<script src="js/scenes/Intro.js?v=16"></script>
<script src="js/scenes/Bedroom.js?v=16"></script>

<script src="js/core/SceneManager.js?v=16"></script>
<script src="js/core/Game.js?v=16"></script>

</body>
</html>
